---
deployment:
  tasks:
    # EDIT DEPLOYPATH to the real web folder for training.igiver.org/englishbuddypro.
    # Find it in cPanel > Domains (subdomain document root). Common guesses:
    #   /home/vna10l90oed1/training.igiver.org/englishbuddypro/
    #   /home/vna10l90oed1/public_html/englishbuddypro/
    - export DEPLOYPATH=/home/vna10l90oed1/public_html/training.igiver.org/englishbuddypro
    - /bin/mkdir -p $DEPLOYPATH
    # Copy only the app files. config.php is NOT copied, so your live keys stay untouched.
    - /bin/cp -f index.html $DEPLOYPATH
    - /bin/cp -f score.php $DEPLOYPATH
    - /bin/cp -f score_gemini.php $DEPLOYPATH
    - /bin/cp -f db.php $DEPLOYPATH
    - /bin/cp -f log.php $DEPLOYPATH
    - /bin/cp -f teacher.php $DEPLOYPATH
    - /bin/cp -f .htaccess $DEPLOYPATH
    - /bin/cp -f config.sample.php $DEPLOYPATH
    - /bin/cp -f generate_audio.php $DEPLOYPATH
    - /bin/cp -rf audio $DEPLOYPATH
